<style>

button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 96px}

.mark{font-weight:800;margin-left:6px}

input.num{width:100%;font-size:20px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text)}

.corr{display:block;font-size:12px;color:var(--teal)}

.pop{max-height:calc(100vh - 32px);overflow:auto;-webkit-overflow-scrolling:touch}
ul.demands{padding-left:0;list-style:none;margin:8px 0}
ul.demands li{background:var(--card2);border-radius:10px;padding:8px 12px;margin:6px 0}
.data{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0}
.data div{margin:4px 0}
.note{background:#2a2410;border:1px solid #5b4a1f;border-radius:10px;padding:8px 12px}
.small{font-size:14px;color:var(--muted)}
.big{font-size:40px;font-weight:800;font-family:Cambria,Georgia,serif;color:var(--gold);line-height:1.1}

.map{width:100%;border-collapse:collapse;font-size:15px}
.map td{padding:7px 8px;border-bottom:1px solid var(--line)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.g{background:var(--teal)}.a{background:var(--gold)}.r{background:var(--red)}
.codein{display:flex;gap:8px}

.bands button{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:14px}
.bands button b{color:var(--gold);margin-right:6px}
.bands button.sel{border-color:var(--gold)}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:700}
.nums button.sel{background:var(--gold);color:#0B1220}
ol.model{padding-left:18px}ol.model li{margin:6px 0}
.cert{text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;margin:0 2px;vertical-align:1px}
.tag.k{background:#60A5FA;color:#0B1220}.tag.app{background:#F5B841;color:#0B1220}.tag.an{background:#2DD4BF;color:#0B1220}.tag.eval{background:#FF6B4A;color:#0B1220}
.chip.animal{color:#0B1220;background:#F5B841;border-color:#F5B841}
.chip.joe{color:#0B1220;background:#c8a06a;border-color:#c8a06a}
.chip.exam{color:#fff;background:#7c3aed;border-color:#7c3aed}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:12px auto 0}
.keypad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:24px;font-weight:700}
.keypad button.ok{background:var(--teal);color:#0B1220}
.codebox{display:flex;justify-content:center;gap:8px;margin:8px 0}
.codebox span{width:40px;height:50px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-size:26px;color:var(--gold)}
.codebox span.f{border-color:var(--gold)}
.ticks label{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.ticks label.on{border-color:var(--teal)}
.ticks input{width:22px;height:22px;flex:none;margin-top:1px}
.rules{font-size:14px;color:#F7D488;background:#2a2410;border:1px solid #5b4a1f;border-radius:10px;padding:8px 12px;margin:10px 0}
.rules li{margin:3px 0}
.book{font-size:13px;color:var(--teal);margin:-2px 0 10px}
.mute{background:none;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.pop.case{top:64px;bottom:12px;overflow:auto;-webkit-overflow-scrolling:touch}.pop.case h3{margin:14px 0 4px;color:var(--gold);font-size:16px}.pop.case p{margin:6px 0;font-size:15px}.grp{border-left:3px solid var(--gold);padding-left:10px;margin:14px 0 4px;font-weight:700;color:var(--gold)}
.scorebig{font-size:54px;font-weight:800;color:var(--gold);font-family:Cambria,Georgia,serif;line-height:1}
.cert .name{font-family:Cambria,Georgia,serif;font-size:26px}
.path li{margin:4px 0}
footer.cr{color:var(--muted);font-size:11px;margin-top:24px}
@media (prefers-reduced-motion:no-preference){.anim .card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
// Shared glossary and command words for the IGCSE Business 0264 review games. All businesses and figures are fictional.
const GLOSSARY = {

  "person specification": "A document that describes the ideal person for the job: skills, qualifications, experience and qualities.",
  "induction training": "Training on a worker's first days: rules, safety and how the business works.",
  "on-the-job training": "Training at the workplace, by watching and working next to an experienced worker.",
  "off-the-job training": "Training away from the workplace, for example at a college or on a course.",

  "chain of command": "The line of authority from the top of the business to the bottom.",
  "delegation": "A manager gives a worker the authority to do a task.",
  "autocratic leadership": "The leader makes all the decisions alone.",

  "laissez-faire leadership": "The leader lets workers make most decisions themselves.",
  "jargon": "Special technical words that people outside a job may not understand. A communication barrier.",

  "sample": "A small group of people who are asked in market research, chosen to represent the whole market.",
  "brand image": "What customers think and feel about a brand.",
  "product life cycle": "The stages a product goes through: introduction, growth, maturity and decline.",
  "extension strategy": "An action to stop sales falling and make a product's life longer.",
  "cost-plus pricing": "The price is the cost per unit plus a percentage mark-up for profit.",
  "penetration pricing": "A low price at the start to win customers and market share quickly.",

  "dynamic pricing": "The price changes often, with demand. For example, higher at busy times.",

  "total cost": "Fixed costs + variable costs.",
  "average cost": "Total cost ÷ output. The cost of one unit.",
  "economies of scale": "The average cost per unit falls as a business grows bigger.",
  "diseconomies of scale": "The average cost per unit rises because the business has grown too big.",

Object.assign(GLOSSARY, {
  "needs": "Things people must have to live: food, water, clothing, shelter.",

  "scarcity": "There are not enough resources to make everything people want.",

  "market research": "Collecting information about customers, competitors and the market."
});

Object.assign(GLOSSARY, {

  { id: "b6s1", type: "story", title: "Whose business is it?", text: `<p>🧾 On paper, {B} belongs to <b>you</b> alone. You are a [[sole trader]].</p><p>🤝 Tuguldur has worked with you from day one. Now he offers <b>10,000,000₮</b> to become a <b>partner</b>.</p><p>🧑‍🏫 Mr. Chris: <i>"More money and more help. But a partner shares your profit and your decisions."</i></p>` },
  { id: "b6s2", type: "sort", topic: "1.4", marks: 2, q: "⭕ Sole trader, partnership or both?", cats: ["Sole trader only", "Partnership only", "Both"], items: [["The owner is their own boss", 0], ["One owner keeps all the profit", 0], ["The owners share the work and the skills", 1], ["Two or more owners put in capital", 1], ["Unlimited liability", 2], ["Easy to set up", 2]], explain: "This is the Venn diagram from your lesson. A [[partnership]] has more money and help, but profit is shared. Both forms have [[unlimited liability]]." },
  { id: "b6s3", type: "mcq", topic: "1.4", marks: 1, q: "{B} owes a bottle supplier 12,000,000₮ and cannot pay. You are a sole trader. What can happen?", opts: ["Your own things, like your savings, can be taken to pay the debt", "You lose only the money you put into {B}", "The government pays the debt", "Nothing happens"], a: 0, explain: "A sole trader has [[unlimited liability]]. In law, the owner and the business are the same. 😬" },
  { id: "b6s4", type: "mcq", topic: "1.4", marks: 1, q: "You and Tuguldur are partners. Tuguldur signs a bad deal, and the business cannot pay. Who is responsible for the debt?", opts: ["Both partners, even you", "Only Tuguldur", "Only the supplier", "Nobody"], a: 0, explain: "Partners usually have unlimited liability, even for each other's decisions. Choose your partner carefully!" },
  { id: "b6s5", type: "choice", title: "Your decision", q: "Do you take Tuguldur as a partner?", opts: [
    { k: "A", t: "Stay a sole trader", d: "Every decision and all the profit stay yours.", set: { own: "sole" }, val: 1, out: "🧍 You stay the only owner. Tuguldur keeps working for a wage. You still work 70 hours a week, and the money is tight.", concept: "A [[sole trader]] is their own boss and keeps all the profit, but finance is hard to find and nobody shares the work." },
    { k: "B", t: "Take Tuguldur as a partner", d: "10,000,000₮ more capital. Shared profit.", set: { own: "partner" }, val: 1, out: "🤝 Tuguldur's 10,000,000₮ comes in. He runs the deliveries, and you run the factory. Sometimes you disagree about new flavors.", concept: "A [[partnership]] brings more capital and skills, but profit is shared and partners may disagree." }
  ] },
  { id: "b6s6", type: "mcq", topic: "1.4", marks: 1, joe: true, q: "🥔 Joe says: <i>'In a partnership, I only pay for my own mistakes.'</i>", opts: ["True", "False"], a: 1, explain: "False. Each partner can be made to pay for the other partner's mistakes too." },
  { id: "b6s7", type: "write", topic: "1.4", exam: true, cmd: "Define", marks: 2, q: "Define <b>'unlimited liability'</b>.", guide: ["One sentence. Give the exact meaning.", "No example needed. Examples get no marks on a Define question."],
    levels: [[2, "Clear: the owners are responsible for ALL the debts of the business / their own possessions can be taken to pay them."], [1, "Some idea: for example 'the owner can lose money'."], [0, "Only an example, or not correct."]],
    model: "Unlimited liability means the owners are responsible for all the debts of the business, so their personal possessions can be sold to pay them. <b>(2)</b>",
    rules: ["Define: 2 marks for clear understanding, 1 mark for some understanding.", "'They lose the money they invested' is LIMITED liability: no marks."] }
  ] },

{ n: 7, code: "169438", img: "money", topic: "1.4", title: "Limited!", sub: "Private and public limited companies", book: "📖 Coursebook pp. 63-64",
  terms: ["private limited company", "public limited company", "limited liability", "shareholder"],
  steps: [
  { id: "b7s1", type: "story", title: "Aunt Oyun has a rule", text: S => `<p>💰 Your Aunt Oyun wants to invest <b>30,000,000₮</b> in {B}.</p><p>🏠 But she has one rule: <i>"My home and my savings must be safe."</i></p><p>🧑‍🏫 Mr. Chris: <i>"${S.vars.own === "partner" ? "A partnership cannot promise that." : "A sole trader cannot promise that."} A limited company can."</i></p>` },
  { id: "b7s2", type: "sort", topic: "1.4", marks: 2, q: "🏢 Private or public limited company?", cats: ["Private limited company", "Public limited company"], items: [["Shares are sold only if the other owners agree", 0], ["The owners are often family and friends", 0], ["Shares are sold to the public on the stock exchange", 1], ["It can raise the most money", 1], ["It must show its accounts to everyone", 1]], explain: "A [[private limited company]] keeps control with a few owners. A [[public limited company]] can raise the most finance, but anyone can buy its shares." },
  { id: "b7s3", type: "mcq", topic: "1.4", marks: 1, q: "Aunt Oyun buys 30,000,000₮ of shares in {B} LLC. Later, the company fails and owes 100,000,000₮. What is the most Aunt Oyun can lose?", opts: ["30,000,000₮: her investment", "100,000,000₮", "Her home and all her savings", "Nothing"], a: 0, explain: "[[limited liability]]: a [[shareholder]] can lose only the money she invested. Never her home. 🛡️" },
  { id: "b7s4", type: "mcq", topic: "1.4", marks: 1, q: "The company still owes 100,000,000₮. Who does limited liability protect?", opts: ["The shareholders, not the company", "The company, so it owes nothing", "The suppliers", "The customers"], a: 0, explain: "Limited liability protects the <b>owners</b>. The company itself still owes all the money." },
  { id: "b7s5", type: "order", topic: "1.4", marks: 2, q: "💵 Put the four types in order: easiest to raise finance (1) to hardest (4).", items: ["Public limited company", "Private limited company", "Partnership", "Sole trader"], explain: "More owners and limited liability make it easier to raise money. A sole trader has only one person's savings." },
  { id: "b7s6", type: "choice", title: "Your decision", q: "Does {B} become a private limited company?", opts: [
    { k: "A", t: "Yes: {B} LLC", d: "Aunt Oyun invests. Limited liability. More paperwork.", set: { form: "ltd" }, val: 2, out: "🏢 {B} LLC is registered. Aunt Oyun's 30,000,000₮ comes in. Your own things are safe now. She also wants a vote on big decisions.", concept: "A [[private limited company]] gives [[limited liability]] and can sell shares to people it chooses. The owners share control." },
    { k: "B", t: "No: stay as you are", d: "Full control. Aunt Oyun keeps her money.", set: { form: "stay" }, val: 1, out: "🏠 You keep full control. Aunt Oyun keeps her 30,000,000₮ in the bank. Every debt of {B} is still your own debt.", concept: "Without a company, the owners keep control but have [[unlimited liability]], and finance is harder to find." }
  ] },
  { id: "b7s7", type: "mcq", topic: "1.4", marks: 1, joe: true, q: "🥔 Joe says: <i>'My private limited company can sell shares on the stock exchange.'</i>", opts: ["True", "False"], a: 1, explain: "False. Only a <b>public</b> limited company can sell shares to the public. A tiny stall should never be a public limited company." },
  { id: "b7s8", type: "write", topic: "1.4", exam: true, cmd: "Outline", marks: 4, q: "Outline <b>two</b> advantages to {B} of becoming a private limited company.",
    guide: ["Advantage 1 [k] + a fact about {B} [app].", "Advantage 2 [k] + a fact about {B} [app]."],
    points: [{ tag: "k", t: "Advantage 1 is correct (limited liability; can raise finance by selling shares; the business continues if an owner leaves; owners keep control of who buys shares)." }, { tag: "app", t: "It uses a fact about {B} (e.g. Aunt Oyun; her 30,000,000₮; her home and savings; the juice factory)." }, { tag: "k", t: "Advantage 2 is a different correct advantage." }, { tag: "app", t: "It uses a fact about {B}." }],
    model: "<p>1. The owners have limited liability [k], so Aunt Oyun's home and savings are safe if {B} fails [app].</p><p>2. A company can raise finance by selling shares [k]: Aunt Oyun will buy 30,000,000₮ of shares [app].</p>",
    rules: ["Outline: 1 mark [k] + 1 mark [app] for each advantage.", "'Sells shares on the stock exchange' is wrong: that is a public limited company."] }
  ] },

{ n: 8, code: "843025", img: "shop", topic: "1.4", title: "Other Shapes", sub: "Franchises, joint ventures and social enterprises", book: "📖 Coursebook pp. 65-68",
  terms: ["franchise", "franchisor", "franchisee", "joint venture"],
  steps: [
  { id: "b8s1", type: "story", title: "A call from Erdenet", text: `<p>📞 Bold from Erdenet calls: <i>"I love your juice. Can I open a <b>{B} Juice Bar</b> here? I will pay for everything."</i></p><p>🧑‍🏫 Mr. Chris: <i>"That is a [[franchise]]. You give the name and the recipe. He gives you money."</i></p><p>💡 Remember: the <b>-or</b> gives, the <b>-ee</b> receives. Like employer and employee.</p>` },
  { id: "b8s2", type: "sort", topic: "1.4", marks: 2, q: "🔁 Who does it: the [[franchisor]] ({B}) or the [[franchisee]] (Bold)?", cats: ["Franchisor provides", "Franchisee pays"], items: [["The brand name and the recipes", 0], ["Training and national advertising", 0], ["A fee at the start", 1], ["A royalty on every sale", 1], ["The money to open the juice bar", 1]], explain: "The franchisor grows with someone else's money. The franchisee buys a name and a system that already work." },
  { id: "b8s3", type: "num", topic: "1.4", exam: true, cmd: "Calculate", marks: 2, unit: "₮", q: "Bold's juice bar has sales of 400,000₮ a day. The [[royalty]] is 10% of sales. Calculate the royalty Bold pays to {B} each day.", formula: "Royalty = sales × royalty % ÷ 100", answer: 40000, explain: "400,000 × 10 ÷ 100 = <b>40,000₮</b> a day. Bold keeps 400,000 − 40,000 = 360,000₮ to pay his costs." },
  { id: "b8s4", type: "mcq", topic: "1.4", marks: 1, q: "Bold's juice bar makes a loss this month. Does he still pay the royalty?", opts: ["Yes: a royalty is a share of sales, not of profit", "No: no profit means no royalty", "Only half of it", "{B} must pay Bold"], a: 0, explain: "A royalty is a percentage of <b>sales</b>. The franchisee pays it even in a month with a loss. ⚠️" },
  { id: "b8s5", type: "mcq", topic: "1.4", marks: 1, q: "{B} and a yoghurt maker agree to make ONE new berry yoghurt drink together. They share the costs, the risks and the profit. What is this?", opts: ["A joint venture", "A takeover", "A franchise", "A public limited company"], a: 0, explain: "A [[joint venture]]: two businesses work together on one project. They also share what they know." },
  { id: "b8s6", type: "num", topic: "1.4", marks: 2, unit: "₮", q: "For Naadam, {B} and a khuushuur stall share one tent. The tent costs 1,200,000₮. They split the cost equally. How much does {B} pay?", formula: "Each share = total cost ÷ 2", answer: 600000, explain: "1,200,000 ÷ 2 = <b>600,000₮</b> each. In a joint venture, the risk and the profit are shared too. 🎪" },
  { id: "b8s7", type: "mcq", topic: "1.4", marks: 1, q: "A business sells juice to pay for clean water in villages. It puts most of its profit back into this aim. What is it?", opts: ["A social enterprise", "A sole trader", "A franchise", "A merger"], a: 0, explain: "A [[social enterprise]] trades for a social or environmental aim. It must still cover its costs, or it helps nobody for long. 🌍" },
  { id: "b8s8", type: "mcq", topic: "1.4", marks: 1, joe: true, q: "🥔 Joe says: <i>'A bad franchisee can hurt my brand name.'</i>", opts: ["True", "False"], a: 0, explain: "True. Customers blame the brand, not the franchisee. This is the franchisor's biggest risk." },
  { id: "b8s9", type: "write", topic: "1.4", exam: true, cmd: "Define", marks: 2, q: "Define <b>'franchise'</b>.", guide: ["One sentence. Give the exact meaning.", "No example needed. Examples get no marks on a Define question."],
    levels: [[2, "Clear: the right to trade under another business's name and system (the franchisor sells it, the franchisee buys it)."], [1, "Some idea: for example 'using another business's name'."], [0, "Only an example, or not correct."]],
    model: "A franchise is the right to trade using another business's name and system. The franchisee buys this right from the franchisor. <b>(2)</b>",
    rules: ["Define: 2 marks for clear understanding, 1 mark for some understanding.", "A brand name alone, like the name of a fast-food chain, earns no marks."] }
  ] },

{ n: 9, code: "297316", img: "survey", topic: "3.1", title: "Five Jobs", sub: "The role of marketing", book: "📖 Coursebook pp. 174-177",
  terms: ["marketing", "customer loyalty", "market research", "brand"],
  steps: [
  { id: "b9s1", type: "story", title: "Marketing is not just adverts", text: `<p>📉 This month, sales of {B} stopped growing.</p><p>💬 Tuguldur: <i>"Easy! We need more adverts."</i></p><p>🧑‍🏫 Mr. Chris: <i>"Advertising is one tool. [[marketing|Marketing]] has <b>five jobs</b>, and the first one starts before you make anything."</i></p>` },
  { id: "b9s2", type: "order", topic: "3.1", marks: 2, q: "🪜 Put the five roles of marketing in the order of your lesson, from first (1) to last (5).", items: ["Identifying customer needs", "Satisfying customer needs", "Maintaining customer loyalty", "Building customer relationships", "Anticipating changes in customer needs"], explain: "Find the need → satisfy it → keep the customer → build the relationship → see the next change coming. 🔭" },
  { id: "b9s3", type: "sort", topic: "3.1", marks: 2, q: "🧩 Which of the five jobs is each action?", cats: ["Identify needs", "Satisfy needs", "Keep loyalty", "Build relationships", "Anticipate change"], items: [["Ask students which flavors they want", 0], ["Make the small bottle they asked for, at a price they can pay", 1], ["Every 10th bottle is free", 2], ["Answer every customer message and visit schools", 3], ["Study trends to see what people will want next year", 4]], explain: "Marketing = finding out what customers need, satisfying them profitably and keeping them loyal." },
  { id: "b9s4", type: "mcq", topic: "3.1", marks: 1, q: "When does marketing start?", opts: ["Before production: needs decide what is made", "After the product is in the shops", "Only when sales fall", "Only when the advert is ready"], a: 0, explain: "Identifying needs comes first. It decides what the business makes at all." },
  { id: "b9s5", type: "mcq", topic: "3.1", marks: 1, q: "Why are loyal customers so important to {B}?", opts: ["Keeping a customer costs less than finding a new one", "Loyal customers never buy anything", "Loyal customers pay no money", "They work in the factory"], a: 0, explain: "Repeat sales are the cheapest sales. Loyal customers also do not switch to Golden Drop. 🔁" },
  { id: "b9s6", type: "mcq", topic: "3.1", marks: 1, joe: true, q: "🥔 Joe says: <i>'Marketing is just a different word for advertising.'</i>", opts: ["True", "False"], a: 1, explain: "False. Advertising is one small part. Marketing starts with customer needs." },
  { id: "b9s7", type: "write", topic: "3.1", exam: true, cmd: "Define", marks: 2, q: "Define <b>'marketing'</b>.", guide: ["One sentence. Give the exact meaning.", "You need two ideas: needs are IDENTIFIED, and needs are SATISFIED."],
    levels: [[2, "Clear: identifying customer needs AND satisfying them (profitably)."], [1, "Some idea: only 'selling' or only 'advertising', or only one of the two ideas."], [0, "Not correct."]],
    model: "Marketing is the business function that identifies customer needs and satisfies them profitably. <b>(2)</b>",
    rules: ["Define: 2 marks for clear understanding, 1 mark for some understanding.", "'Selling' or 'adverts' alone stays at 1 mark."] },
  { id: "b9s8", type: "write", topic: "3.1", exam: true, cmd: "State", marks: 2, q: "State <b>two</b> roles of marketing.",
    guide: ["State = short answers. No explanation is needed.", "Only your first two answers count."],
    points: [{ tag: "k", t: "First answer is one of the five roles." }, { tag: "k", t: "Second answer is a different role." }],
    modelTitle: "Accepted answers (any two)", model: "<p>Identifying customer needs · satisfying customer needs · maintaining customer loyalty · building customer relationships · anticipating changes in customer needs</p>",
    rules: ["State: 1 mark each for the first two valid answers."] }
  ] },

{ n: 10, code: "658149", img: "supermarket", topic: "3.1", title: "Markets on the Move", sub: "Why spending changes and competition grows", book: "📖 Coursebook pp. 177-181",
  terms: ["consumer spending patterns", "globalisation", "ecommerce", "customer loyalty"],
  steps: [
  { id: "b10s1", type: "story", title: "Three pieces of bad news", text: `<p>🍬 Students now want drinks with <b>less sugar</b>. Your juice is sweet.</p><p>🌍 <b>Zesty</b>, a foreign juice brand, arrives in every supermarket.</p><p>📱 A new app compares the price of every drink in seconds.</p><p>🧑‍🏫 Mr. Chris: <i>"The market never stands still. Standing still loses twice."</i></p>` },
  { id: "b10s2", type: "sort", topic: "3.1", marks: 2, q: "🔀 Is it a reason why <b>spending patterns change</b>, or a reason why <b>competition grows</b>?", cats: ["Spending changes", "Competition grows"], items: [["Incomes rise or fall", 0], ["Tastes and fashions change", 0], ["The population gets older", 0], ["Ecommerce: businesses anywhere can sell everywhere", 1], ["Globalisation brings in foreign brands", 1], ["New businesses enter a market that looks profitable", 1]], explain: "[[consumer spending patterns]] change with incomes, tastes, technology and population. Competition grows with [[ecommerce]], [[globalisation]] and new businesses." },
  { id: "b10s3", type: "sort", topic: "3.1", marks: 2, q: "🎯 Match the best response to each change.", cats: ["New or improved product", "Lower costs", "Better service", "Find new markets"], items: [["Customers' tastes have changed", 0], ["A rival starts a price war", 1], ["A rival tries to take your loyal customers", 2], ["Your market is getting smaller", 3]], explain: "Match the response to the change. A taste shift wants a <b>product</b> answer. A price war wants a <b>cost</b> answer, so the price can fall without killing profit." },
  { id: "b10s4", type: "mcq", topic: "3.1", marks: 1, q: "How has ecommerce made markets more competitive?", opts: ["Customers can buy from sellers anywhere and compare prices easily", "Customers can buy only from local shops", "It stops new businesses from starting", "It makes every price the same"], a: 0, explain: "Online, a rival does not need a shop near you. Customers see every price, so each business must offer better value. 🛒" },
  { id: "b10s5", type: "choice", title: "Your answer to the market", q: "Students want less sugar. What does {B} do first?", opts: [
    { k: "A", t: "A new low-sugar recipe", d: "A product answer.", set: { resp: "product" }, val: 2, out: "🆕 You ask 200 students, then launch {B} Light. In two months, it is your best seller. 🎉", concept: "A taste shift wants a product answer: improve or replace the product." },
    { k: "B", t: "Cut the price of the sweet juice", d: "A price answer.", set: { resp: "price" }, val: 0.5, out: "🏷️ A few more bottles sell, but students still want less sugar. Your profit on each bottle is smaller now.", concept: "A mismatch: a cheaper version of yesterday's product is still yesterday's product." },
    { k: "C", t: "More adverts for the sweet juice", d: "A promotion answer.", set: { resp: "advert" }, val: 0.5, out: "📣 Everyone sees your advert. They still buy the low-sugar drink from a rival.", concept: "A mismatch: promotion cannot fix a product that customers no longer want." }
  ] },
  { id: "b10s6", type: "mcq", topic: "3.1", marks: 1, joe: true, q: "🥔 Joe says: <i>'Customer tastes never change.'</i>", opts: ["True", "False"], a: 1, explain: "False. Fashion, health and technology change what people buy. 🔄" },
  { id: "b10s7", type: "write", topic: "3.1", exam: true, cmd: "Identify", marks: 2, q: "Identify <b>two</b> reasons why markets are becoming more competitive.",
    guide: ["Identify = just name them. No explanation is needed.", "Only your first two answers count."],
    points: [{ tag: "k", t: "First answer is correct (ecommerce or internet shopping; globalisation; new businesses entering the market; easy price comparison online)." }, { tag: "k", t: "Second answer is a different correct reason." }],
    model: "1. Ecommerce [k] &nbsp; 2. Globalisation [k]",
    rules: ["Identify: 1 mark each for the first two valid answers.", "'Tastes change' is a reason for spending patterns, not for competition."] }
  ] },

{ n: 11, code: "731594", img: "shelf", topic: "3.1", title: "Your Slice", sub: "Market share and market growth", book: "📖 Coursebook pp. 182-184",
  terms: ["market share", "market growth", "customer loyalty", "marketing"],
  steps: [
  { id: "b11s1", type: "story", title: "The juice market", text: `<p>📊 Mr. Chris shows you the juice market in Ulaanbaatar last year:</p><table class="data"><tr><th>Business</th><th>Sales (₮)</th></tr><tr><td>Zesty</td><td>320,000,000</td></tr><tr><td>Golden Drop</td><td>240,000,000</td></tr><tr><td>{B}</td><td>160,000,000</td></tr><tr><td>All others</td><td>80,000,000</td></tr><tr><td><b>Total market</b></td><td><b>800,000,000</b></td></tr></table><p>📓 Copy this table into your notebook.</p><p>🧮 The recipe: <b>the business's sales ÷ total market sales × 100</b>. Keep the % sign.</p>` },
  { id: "b11s2", type: "num", topic: "3.1", exam: true, cmd: "Calculate", marks: 2, unit: "%", q: "{B} has sales of 160,000,000₮. Total market sales are 800,000,000₮. Calculate {B}'s [[market share]].", formula: "Market share = sales of the business ÷ total market sales × 100", answer: 20, explain: "160,000,000 ÷ 800,000,000 = 0.2. Then 0.2 × 100 = <b>20%</b>. ✍️ Formula, numbers, answer with %." },
  { id: "b11s3", type: "num", topic: "3.1", marks: 2, unit: "%", q: "Golden Drop has sales of 240,000,000₮ in the 800,000,000₮ market. Calculate its market share.", formula: "Market share = sales of the business ÷ total market sales × 100", answer: 30, explain: "240,000,000 ÷ 800,000,000 = 0.3. Then 0.3 × 100 = <b>30%</b>." },
  { id: "b11s4", type: "mcq", topic: "3.1", marks: 1, q: "Zesty has 40%, Golden Drop 30% and {B} 20%. What is the share of 'all others'? Use the self-check: all shares add up to 100%.", opts: ["10%", "20%", "5%", "90%"], a: 0, explain: "40 + 30 + 20 = 90. So the others have 100 − 90 = <b>10%</b>. All the shares in a market always add up to 100%. ✅" },
  { id: "b11s5", type: "mcq", topic: "3.1", marks: 1, q: "A student calculates 800,000,000 ÷ 160,000,000 × 100 = 500%. What went wrong?", opts: ["The division is upside down: no share can be more than 100%", "Nothing: 500% is correct", "The % sign should be ₮", "The student forgot to add"], a: 0, explain: "The business's sales go on top. A share above 100% is impossible, so check again. 🙃" },
  { id: "b11s6", type: "num", topic: "3.1", marks: 2, unit: "%", q: "The total juice market was 640,000,000₮ the year before. Last year, it was 800,000,000₮. Calculate the [[market growth]].", formula: "Market growth = change in market sales ÷ old market sales × 100", answer: 25, explain: "Change: 800,000,000 − 640,000,000 = 160,000,000. Then 160,000,000 ÷ 640,000,000 × 100 = <b>25%</b>. 📈" },
  { id: "b11s7", type: "mcq", topic: "3.1", marks: 1, q: "{B}'s sales went up last year, but its market share went down. How is this possible?", opts: ["The whole market grew faster than {B}'s sales", "{B} sold nothing", "Sales and market share are the same thing", "It is not possible"], a: 0, explain: "If the pie grows faster than your slice, your share falls. Rivals like Zesty won more of the new customers. 🥧" },
  { id: "b11s8", type: "mcq", topic: "3.1", marks: 1, joe: true, q: "🥔 Joe says: <i>'My market share is 0.2. That is a full-mark answer.'</i>", opts: ["True", "False"], a: 1, explain: "False. Market share is a percentage: 20%. The % sign carries a mark." },
  { id: "b11s9", type: "num", topic: "3.1", exam: true, cmd: "Calculate", marks: 2, unit: "%", q: "Next year, the total juice market is 1,000,000,000₮. {B}'s sales are 250,000,000₮. Calculate {B}'s market share next year.", formula: "Market share = sales of the business ÷ total market sales × 100", answer: 25, explain: "250,000,000 ÷ 1,000,000,000 = 0.25. Then 0.25 × 100 = <b>25%</b>. Your slice grew from 20% to 25%. 🎉" }
  ] },

{ n: 12, code: "460287", img: "exam", topic: "Final", title: "The Exam Room", sub: "One full 8-mark (d) question", book: "📖 Coursebook pp. 177-181",
  terms: ["marketing", "market share", "customer loyalty", "globalisation"],
  steps: [
  { id: "b12s1", type: "story", title: "Zesty attacks", text: `<p>⚔️ Zesty cuts its price. {B} is losing customers.</p><div class="data"><div>🏷️ Zesty's price: <b>2,500₮</b> a bottle. {B}'s price: <b>3,000₮</b>.</div><div>🧾 It costs {B} <b>2,200₮</b> to make one bottle.</div><div>📋 Survey: <b>6 of every 10</b> students want a low-sugar juice.</div><div>🚫 Zesty has no low-sugar juice.</div></div><p>🧑‍🏫 Mr. Chris: <i>"One last test. The (d) question is worth 8 marks. Two sides, then a decision with a NEW reason."</i></p>` },
  { id: "b12s2", type: "write", topic: "Final", exam: true, cmd: "Justify", marks: 8, q: "{B} is losing customers to Zesty. Explain <b>two</b> ways {B} could respond: cutting its price and developing a new product. Which way should {B} choose? <b>Justify</b> your answer.",
    guide: ["Way 1: say what it does [k] + a fact about {B} [app] + so... [an].", "Way 2: the same three moves.", "Decision: which one, and WHY it is better than the other [eval]. Do not just repeat."],
    frame: ["Cutting the price would ... For {B}, ... so ...", "Developing a new product would ... For {B}, ... so ...", "{B} should choose ... because ...", "This is better than ... because ..."],
    points: [
      { tag: "k", t: "Price cut is explained correctly (a lower price can win back customers or sales from rivals)." },
      { tag: "k", t: "New product is explained correctly (a new or improved product can satisfy changed customer needs)." },
      { tag: "app", t: "The price part uses a fact about {B} (3,000₮; Zesty's 2,500₮; the 2,200₮ cost)." },
      { tag: "app", t: "The product part uses a fact about {B} (6 of 10 students; low sugar; Zesty has no low-sugar juice)." },
      { tag: "an", t: "The price part has a consequence: 'so...' or 'which means...'." },
      { tag: "an", t: "The product part has a consequence." },
      { tag: "eval", t: "A clear decision: which way {B} should choose." },
      { tag: "eval", t: "The decision has a comparing reason that is NEW, not a repeat." }
    ],
    model: `<p><b>Cutting the price.</b> A lower price can win customers back from a rival [k]. {B} sells at 3,000₮ and Zesty at 2,500₮ [app]. If {B} matches 2,500₮, it earns only 300₮ on each bottle, not 800₮, because a bottle costs 2,200₮ to make. So sales may rise, but profit falls sharply [an].</p>
<p><b>Developing a new product.</b> A new product can satisfy customer needs that have changed [k]. 6 of every 10 students want a low-sugar juice, and Zesty does not sell one [app]. So {B} could win these customers without a price war, and keep its 3,000₮ price [an].</p>
<p><b>Decision:</b> {B} should develop the low-sugar juice [eval]. The problem is not only the price: tastes have changed, and a cheaper version of yesterday's juice is still yesterday's juice. A price cut is also easy for Zesty to copy, but a new recipe is not. The price cut would be better only if {B} could lower its costs first [eval].</p>`,
    rules: ["(d) questions: up to 2 marks each for [k], [app], [an] and [eval].", "The decision must add something new. Repeating earlier points earns no [eval] marks.", "Any decision can earn full marks if it is justified. The model chooses the new product; you may choose the price cut."] },

<script>
const KEY = GAME.key;
const MASTER = GAME.master;
let S = load() || fresh();
let ui = {};
let AC = null;
function tone(freqs, dur, type, vol){ if (S.mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime; freqs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0 + i * dur); g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + i * dur + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur + 0.15); o.connect(g); g.connect(AC.destination); o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.2); }); } catch (e) {} }
const ding = () => tone([880, 1320], 0.09, "sine", 0.06), thud = () => tone([196], 0.14, "triangle", 0.05), fanfare = () => tone([523, 659, 784, 1047], 0.1, "sine", 0.05);
function fresh(){ return { name:"", val:10, ch:0, step:0, screen:"start", unlocked:{}, vars:Object.assign({}, GAME.vars0 || {}), res:{}, master:false, mute:false }; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const fmt = n => { const r = Math.round(n*10)/10; return r.toLocaleString("en-US"); };
const money = n => "MNT " + Math.round(n).toLocaleString("en-US");
function val(x){ return typeof x === "function" ? x(S) : x; }
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function sub(t){ return String(t).replace(/\{B\}/g, esc(S.vars.brand || "your business")).replace(/\{N\}/g, esc(S.name || GAME.roleName || "Founder")); }
function gl(html){
  return sub(html).replace(/\[\[([^\]]+)\]\]/g, (m, w) => {
    const [term, label] = w.split("|");
    const k = Object.keys(GLOSSARY).find(g => g.toLowerCase() === term.toLowerCase());
    return k ? `<span class="term" data-act="term" data-term="${k}">${label || term}</span>` : (label || term);
  }).replace(/\[(k|app|an|eval)\]/g, (m, t) => `<span class="tag ${t}">${t}</span>`);
}
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed); const idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function parseNum(t){ if (t == null) return NaN; t = String(t).trim().toLowerCase().replace(/₮|tugrik|tögrög|mnt|packs?|points?|units?|hoodies?|cups?|bags?|bottles?|people|students?|customers?|workers?|,|%|\s/g, ""); let mult = 1; if (/(billion|bn)$/.test(t)) { mult = 1e9; t = t.replace(/(billion|bn)$/, ""); } else if (/(million|m)$/.test(t)) { mult = 1e6; t = t.replace(/(million|m)$/, ""); } return parseFloat(t) * mult; }
function close(x, ans){ if (isNaN(x)) return false; const tol = Math.max(Math.abs(ans) * 0.005, 0.01); return [1, 1e6, 1e9].some(k => Math.abs(x * k - ans) <= tol); }

function ch(){ return CHAPTERS[S.ch]; }
function step(){ return ch().steps[S.step]; }
function addVal(d){ S.val = Math.round((S.val + d) * 10) / 10; }
function record(st, earned, extra){ S.res[st.id] = Object.assign({ done:true, earned, max: st.marks || 0, topic: st.topic, ch: S.ch }, extra || {}); addVal(earned); save(); render(); }

function header(){
  $("brand").innerHTML = GAME.brand;
  $("val").textContent = (GAME.valIcon || "🥟") + " " + fmt(S.val) + (GAME.valUnit === undefined ? "M₮" : GAME.valUnit); $("casebtn").style.display = GAME.caseFile && S.screen !== "start" ? "" : "none"; $("mutebtn").textContent = S.mute ? "🔇" : "🔊";
  $("dots").innerHTML = CHAPTERS.map((c, i) => `<i class="${i < S.ch || (S.screen === "report") ? "done" : i === S.ch && S.screen !== "start" ? "cur" : ""}"></i>`).join("");
}
function chips(st){
  let h = `<div class="chips"><span class="chip topic">${st.topic === "Final" ? (GAME.finalLabel || "Paper 1") : st.topic}</span>`;
  if (st.exam && st.cmd) h += `<span class="chip exam">📝 ${st.part || "Exam part"}</span><span class="chip animal">${CMD[st.cmd].animal} · ${st.cmd} · ${st.label || "[" + st.marks + "]"}</span>`;
  else h += `<span class="chip">Quick check · ${st.marks} pt${st.marks === 1 ? "" : "s"}</span>`;
  if (st.joe) h += `<span class="chip joe">🥔 Joe says</span>`;
  let x = h + "</div>";
  if (st.exam && st.cmd) x += `<p class="small" style="margin:-4px 0 8px">${st.cmd} = ${CMD[st.cmd].means}.</p>`;
  return x;
}
function heroFor(c){
  const im = IMG[c.img];
  return `<div class="hero">${im ? `<img src="${im}" alt="">` : ""}<div class="cap"><div class="chn">${c.n === CHAPTERS.length && GAME.lastWord !== null ? (GAME.lastWord || "Finale") : (GAME.chapterWord || "Chapter") + " " + c.n} · ${c.topic === "Final" ? (GAME.finalLabel || "Paper 1") : c.topic}</div><h1>${c.title}</h1><div class="sub">${c.sub}</div></div></div>${CREDITS[c.img] ? `<div class="credit">Photo: ${CREDITS[c.img]}</div>` : ""}${c.book ? `<div class="book">${c.book}</div>` : ""}`;
}
function nextBtn(label){ return `<div class="row"><button class="btn" data-act="next">${label || "Continue →"}</button></div>`; }

let lastKey = "";
function render(){
  header();
  const app = $("app");
  const key = S.screen + "|" + S.ch + "|" + S.step;
  if (key !== lastKey) { lastKey = key; app.classList.add("anim"); window.scrollTo(0, 0); } else app.classList.remove("anim");
  if (S.screen === "start") return app.innerHTML = startScreen();
  if (S.screen === "gate") return app.innerHTML = gateScreen();
  if (S.screen === "end") return app.innerHTML = endScreen();
  if (S.screen === "report") return app.innerHTML = reportScreen();
  const c = ch(), st = step();
  app.innerHTML = heroFor(c) + renderStep(st);
}

function startScreen(){
  return `<div class="hero">${IMG.cover ? `<img src="${IMG.cover}" alt="">` : ""}<div class="cap"><div class="chn">${GAME.kicker}</div><h1>${GAME.title}</h1><div class="sub">${GAME.sub}</div></div></div>${CREDITS.cover ? `<div class="credit">Photo: ${CREDITS.cover}</div>` : ""}
<div class="card"><h2>How to play</h2>${GAME.howto}

function showScore(){ const x = totals(); $("pop").innerHTML = `<div class="pop" style="text-align:center"><b>${esc(S.name || GAME.roleName || "Founder")}</b> · ${esc(S.vars.brand || "")}<div class="scorebig" style="margin:8px 0">${fmt(x.xe + x.e)} / ${x.xm + x.m}</div><p class="small">Score so far · reached ${GAME.chapterWord || "Chapter"} ${S.ch + 1} of ${CHAPTERS.length}<br>Exam parts ${fmt(x.xe)} of ${x.xm} · Quick checks ${fmt(x.e)} of ${x.m}</p><div class="row" style="justify-content:center"><button class="btn" data-act="popclose">Close</button></div></div>`; }

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) { if (!ev.target.closest(".pop")) $("pop").innerHTML = ""; return; }
  const a = b.dataset.act, st = (S.screen === "play") ? step() : null;
  if (a === "term") { const k = b.dataset.term; $("pop").innerHTML = `<div class="pop"><b>${k}</b><br>${GLOSSARY[k]}</div>`; ev.stopPropagation(); return; }
  if (a === "menu") return showMenu();
  if (a === "myscore") return showScore();
  if (a === "case") return showCase();
  if (a === "mute") { S.mute = !S.mute; save(); return header(); }
  if (a === "key") {
    const k = b.dataset.k; ui.code = ui.code || ""; ui.codeErr = false;
    if (k === "⌫") ui.code = ui.code.slice(0, -1);
    else if (k === "✓") {
      if (ui.code === MASTER) S.master = true;
      if (ui.code === ch().code || ui.code === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); fanfare(); return render(); }
      ui.codeErr = true; ui.code = ""; thud();
    } else if (ui.code.length < 6) ui.code += k;
    return render();
  }
  if (a === "popclose") { $("pop").innerHTML = ""; return; }
  if (a === "reset") {
    if (!ui.confirmReset) { ui.confirmReset = true; b.textContent = "Tap again to erase my progress"; return; }
    S = fresh(); ui = {}; save(); $("pop").innerHTML = ""; return render();
  }
  if (a === "startgo") { S.name = ($("nm").value || "").trim().slice(0, 24); S.screen = "gate"; S.ch = 0; save(); return render(); }
  if (a === "code") {
    const v = ($("code").value || "").trim().toUpperCase();
    if (v === MASTER) S.master = true;
    if (v === ch().code || v === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); return render(); }
    ui.codeErr = true; return render();
  }
  if (a === "next") { ui = {}; let n = S.step + 1; while (n < ch().steps.length && ch().steps[n].show && !ch().steps[n].show(S)) n++; if (n < ch().steps.length) S.step = n; else S.screen = "end"; save(); return render(); }
  if (a === "tonext") {
    ui = {};
    if (S.ch === CHAPTERS.length - 1) { S.screen = "report"; save(); return render(); }
    S.ch++; S.step = 0; S.screen = (S.master || S.unlocked[S.ch]) ? "play" : "gate"; save(); return render();
  }
  if (a === "flip") { ui.flip = ui.flip || {}; ui.flip[b.dataset.i] = !ui.flip[b.dataset.i]; return render(); }
  if (!st) return;
  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.lock && o.lock(S)) return;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || (S.tries && S.tries[st.id] ? S.tries[st.id].slice() : []);
    if (ui.tries.includes(i)) return;
    ui.tries.push(i); (S.tries = S.tries || {})[st.id] = ui.tries; save();
    if (i === st.a) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2 || val(st.opts).length === 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    (right === st.items.length ? ding : right ? () => {} : thud)();
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || (S.tries && S.tries[st.id] ? S.tries[st.id].slice() : []);
    if (raw.trim() === "") return;
    ui.tries.push(raw); (S.tries = S.tries || {})[st.id] = ui.tries; save();
    if (close(x, val(st.answer))) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const sl = val(st.slots); const right = sl.filter((_, i) => ui.pick[i] === 0).length; (right === sl.length ? ding : () => {})(); return record(st, right * st.marks / sl.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; if (right === st.items.length) ding(); return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
  if (a === "lvl") { ui.lvl = +b.dataset.i; return render(); }
  if (a === "tick") { ui.ticks = ui.ticks || {}; ui.ticks[b.dataset.i] = b.checked; return render(); }
  if (a === "wsave") { const m = st.levels ? st.levels[ui.lvl][0] : st.points.filter((_, i) => (ui.ticks || {})[i]).length; return record(st, m, st.levels ? { lvl: ui.lvl } : { ticks: ui.ticks || {} }); }
});
document.addEventListener("keydown", e => { if (S.screen === "gate" && /^[0-9]$|^Backspace$|^Enter$/.test(e.key)) { const k = e.key === "Backspace" ? "⌫" : e.key === "Enter" ? "✓" : e.key; const btn = document.querySelector(`[data-act="key"][data-k="${k}"]`); if (btn) btn.click(); return; } if (e.key === "Enter") { const c = document.querySelector('[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
</script>
